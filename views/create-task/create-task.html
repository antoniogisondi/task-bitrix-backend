<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Creazione incarico Bitrix24</title>
</head>
<body>

<div class="container">
  <h1>Crea nuovo incarico</h1>

  <form id="taskForm">
    <label for="title">Titolo incarico</label>
    <input type="text" id="title" name="title" required>

    <label for="azienda">Azienda</label>
    <input type="text" id="azienda" name="azienda" required>

    <label for="description">Descrizione</label>
    <textarea id="description" name="description" required></textarea>

    <label for="deadline">Scadenza</label>
    <input type="datetime-local" id="deadline" name="deadline" required>

    <label for="responsible_id">Responsabile Bitrix ID</label>
    <input type="number" id="responsible_id" name="responsible_id" value="11" required>

    <label for="participants">Partecipanti Bitrix ID</label>
    <input type="text" id="participants" name="participants" placeholder="Esempio: 12,13,14">

    <label for="firma">Firma incarico</label>
    <input type="text" id="firma" name="firma" placeholder="Es. Da acquisire / Mario Rossi">

    <button type="submit">Crea incarico su Bitrix24</button>
  </form>

  <div id="resultBox" class="result"></div>
</div>

<script>
  const form = document.getElementById('taskForm');
  const resultBox = document.getElementById('resultBox');

  form.addEventListener('submit', async function (event) {
    event.preventDefault();

    resultBox.style.display = 'none';
    resultBox.className = 'result';
    resultBox.innerHTML = '';

    const formData = new FormData(form);

    try {
      const response = await fetch('create-task.php', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      resultBox.style.display = 'block';

      if (data.success) {
        resultBox.classList.add('success');
        resultBox.innerHTML = 'Incarico creato correttamente. ID Bitrix: ' + data.task_id;
        form.reset();
      } else {
        resultBox.classList.add('error');
        resultBox.innerHTML = 'Errore: ' + data.message;
      }

    } catch (error) {
      resultBox.style.display = 'block';
      resultBox.classList.add('error');
      resultBox.innerHTML = 'Errore di comunicazione con il server PHP.';
    }
  });
</script>

</body>
</html>
